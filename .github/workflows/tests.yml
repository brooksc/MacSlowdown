name: Tests

# Manual, and on changes to main. Deliberately not scheduled: this repo has no
# release cadence yet, and a nightly run would spend account-wide artifact
# storage on results nobody reads.
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # A newer push makes an in-flight run irrelevant.
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: macOS 26
    # The point of running here at all. Everything in probe/FINDINGS.md was
    # measured on macOS 27 with an Xcode 27 beta; the deployment target is 26.0,
    # and TASK-45 — re-validate the Tier 0 findings on 26 — has been parked for
    # weeks for want of a 26 machine. This is one, on every push.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        # Recorded rather than assumed: when CI and a developer machine
        # disagree, the first question is always which OS and compiler saw the
        # code.
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Install Tuist
        # The manifests are the source of truth; there is no committed
        # .xcodeproj, so nothing builds without this.
        #
        # Via Homebrew, not `curl -Ls https://install.tuist.io | bash`. That
        # installer is behind Cloudflare, which serves a JavaScript challenge to
        # a CI runner rather than a script — the first run of this workflow piped
        # an HTML challenge page into bash and died on `syntax error near
        # unexpected token '<'`.
        run: brew install --quiet tuist

      - name: Generate the project
        run: tuist generate --no-open
        env:
          TUIST_SKIP_UPDATE_CHECK: 1

      - name: Test
        env:
          TUIST_SKIP_UPDATE_CHECK: 1
        # Two suites are skipped, and not because they are flaky. They
        # synthesise CPU load and assert on the separation between a busy
        # process and a quiet one, so what they measure is the machine they run
        # on. A shared runner is contended by definition, and
        # realSlowdownProducesOneIncident already declines to run when its own
        # baseline guard sees the machine is too busy. Running them here would
        # test GitHub's hardware rather than this code.
        #
        # They stay in the suite on a real machine; CLAUDE.md names them and says
        # to re-run any failure in isolation. Verified locally that these flags
        # match the real identifiers: 1284 passing with them skipped, 1290 with.
        #
        # **Code signing is off, and that has a consequence worth stating.** The
        # runner holds no Apple Development certificate, so the first attempt
        # failed before compiling. Ad-hoc signing (CODE_SIGN_IDENTITY="-") was
        # tried and is worse: the app-hosted MacSlowdownTests bundle hangs before
        # the test runner connects, because the entitlements apply and the
        # sandbox then blocks the host app from launching as a test host.
        #
        # So CI builds unsigned, which means **CI does not exercise the sandbox**.
        # Every sandbox fact in probe/FINDINGS.md was measured with
        # probe/build-sandboxed.sh against a signed .app, and that remains the
        # only thing that can verify sandbox behaviour. What this job verifies is
        # that the code compiles on the stable toolchain and that the logic holds
        # — which is what the suite tests anyway.
        run: |
          xcodebuild test \
            -scheme AllTests \
            -configuration Debug \
            -destination 'platform=macOS' \
            -derivedDataPath .build \
            -resultBundlePath TestResults.xcresult \
            -skip-testing:MetricsTests/CPUWorkloadTests \
            -skip-testing:MetricsTests/EndToEndIncidentTests \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Upload results
        # Failure only, retained one day. Actions storage is an account-wide
        # quota shared with every other repository, and a green run's result
        # bundle is hundreds of megabytes nobody will open.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult-${{ github.run_id }}
          path: TestResults.xcresult
          retention-days: 1
